name: "Speaker or transcript mistakes / 说话人或逐字稿有误"
description: "A speaker has the wrong name or isn't recognized, or words are misheard, missing or repeated. / 说话人认错或没认出来，逐字稿里有听错、漏掉或重复的字。"
title: "[Transcript] "
labels: ["bug", "transcript"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public, so please don't attach recordings or paste transcript text; the answers below and the `meetcap doctor` output are all we need.

        Issue 是公开的，请不要附录音或贴逐字稿原文，填下面几项、附上 `meetcap doctor` 的输出就够了。
  - type: input
    id: macos
    attributes:
      label: "macOS version / macOS 版本"
      description: "Apple menu › About This Mac. / 苹果菜单 › 关于本机。"
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "MeetCap version / MeetCap 版本"
      description: |
        With the meeting window open, choose MeetCap › About MeetCap, or run `meetcap --version` in Terminal.

        打开会议窗口，点菜单栏的 MeetCap › 关于 MeetCap，或在终端里运行 `meetcap --version`。
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: "How did you install MeetCap? / 怎么装的"
      options:
        - "Download page (meetcap.seacen.dev/download) / 下载页"
        - "Terminal command (install.sh) / 终端里的一行命令"
    validations:
      required: true
  - type: dropdown
    id: meeting_kind
    attributes:
      label: "What you recorded / 录的是什么"
      options:
        - "An online meeting (any app or browser) / 线上会（任何会议软件或浏览器）"
        - "An in-person meeting / 线下会"
        - "A recording I already had / 已有的录音文件"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: "Language spoken / 会上说的语言"
      options:
        - "English / 英文"
        - "Chinese / 中文"
        - "Both / 中英夹杂"
    validations:
      required: true
  - type: input
    id: speakers
    attributes:
      label: "About how many people spoke / 大约几个人发言"
      placeholder: "4"
    validations:
      required: false
  - type: textarea
    id: happened
    attributes:
      label: "What happened / 发生了什么"
      description: |
        Describe it in your own words.

        用你自己的话说就好。
      placeholder: |
        e.g. Someone I named last week wasn't recognized today. / Our product name keeps coming out as a different word.
        例：上周起过名字的人，今天没认出来。／我们的产品名总被识别成别的词。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What you expected / 正常应该是什么样"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "Output of meetcap doctor / meetcap doctor 的检查结果"
      description: |
        Run `meetcap doctor` in Terminal and paste everything it prints. If Terminal can't find the command, run `~/.local/bin/meetcap doctor`. It shows folder paths on your computer; delete any you'd rather not share.

        在终端里运行 `meetcap doctor`，把显示的内容全部贴上。如果终端提示找不到命令，运行 `~/.local/bin/meetcap doctor`。结果里有电脑上的文件夹路径，不想公开的可以删掉。
      render: shell
    validations:
      required: false
